name: "Console"

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  console:
    runs-on: ubuntu-latest
    name: Get console logs
    env:
      # The pull request preview of this repository (this one is GitHub Pages with a pr-preview deployment)
      PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
    steps:
      - name: Wait for the preview
        uses: Primajin/.github/actions/wait-for-url@v1
        with:
          url: ${{ env.PREVIEW_URL }}
      - name: Use WebApp Console Log Action
        uses: Primajin/webapp-console-log-action@v2
        with:
          webapp-url: ${{ env.PREVIEW_URL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: "Screenshots"

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write # upload the screenshots as release assets (release-id)
  pull-requests: write # post and edit the screenshot comment

jobs:
  screenshots:
    runs-on: ubuntu-latest
    name: Take screenshots of the preview
    env:
      # The pull request preview of this repository (this one is GitHub Pages with a pr-preview deployment)
      PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
    steps:
      - name: Wait for the preview
        uses: Primajin/.github/actions/wait-for-url@v1
        with:
          url: ${{ env.PREVIEW_URL }}
      - name: screenshots-ci-action
        uses: Primajin/screenshots-ci-action@v4
        with:
          devices: iPhone 13,iPad Pro 11,iPad Pro 11 landscape
          full-page: false
          no-desktop: true
          # Id of a published (pre-)release the screenshots are uploaded to. Needed for the pull request comment,
          # see README.PR.md of the action.
          # release-id: 123456789
          type: png
          url: ${{ env.PREVIEW_URL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          path: screenshots
          name: Download-screenshots

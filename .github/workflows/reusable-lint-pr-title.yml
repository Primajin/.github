name: Reusable lint PR title

# Reusable workflow: keeps a pull request title in sync with its commits and validates
# that it follows Conventional Commits.
#
#   1. "Promote PR title bump level to match highest commit bump level": if any commit in
#      the PR implies a bigger release bump (feat -> minor, `!` / BREAKING CHANGE -> major)
#      than the title does, the title type is promoted accordingly. Skipped for fork PRs
#      (GITHUB_TOKEN cannot edit them) and for titles that are not Conventional Commits.
#   2. "Validate PR title follows Conventional Commits": amannn/action-semantic-pull-request.
#
# Call it from a `pull_request` workflow (opened, edited, synchronize, reopened). The
# calling job must grant `pull-requests: write`; a called workflow cannot raise permissions.
#
# Usage (caller):
#   jobs:
#     lint-pr-title:
#       if: github.event_name == 'pull_request'
#       permissions:
#         pull-requests: write
#       uses: Primajin/.github/.github/workflows/reusable-lint-pr-title.yml@v1
#
# See docs/reusable-workflows.md for all inputs.

on:
  workflow_call:
    inputs:
      types:
        description: Newline-separated list of allowed Conventional Commit types.
        type: string
        default: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
          revert
          deps
      require-scope:
        description: "Whether the PR title must contain a scope, e.g. feat(api): subject."
        type: boolean
        default: false

permissions: {}

jobs:
  sync-pr-title-with-commits:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    name: Promote PR title bump level to match highest commit bump level
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const PR_NUMBER = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            // GITHUB_TOKEN is read-only for pull requests from forks, so the title cannot be updated there.
            const isFork = context.payload.pull_request.head.repo.full_name !== context.payload.pull_request.base.repo.full_name;
            if (isFork) {
              core.info('PR is from a fork; skipping PR title sync because GITHUB_TOKEN cannot update fork PR titles.');
              return;
            }

            const PATCH = 0;
            const MINOR = 1;
            const MAJOR = 2;

            const MINOR_TYPES = new Set(['feat']);

            function bumpLevelFromMessage(message) {
              const lines = message.split('\n');
              const firstLine = lines[0];

              if (/^[a-z]+(?:\([^)]+\))?!:/i.test(firstLine)) return MAJOR;

              if (lines.some(line => /^BREAKING[ -]CHANGE:/i.test(line.trim()))) return MAJOR;

              const match = firstLine.match(/^([a-z]+)(?:\([^)]+\))?:/i);

              if (match && MINOR_TYPES.has(match[1].toLowerCase())) return MINOR;

              return PATCH;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: PR_NUMBER,
            });

            let maxBump = PATCH;

            for (const { commit } of commits) {
              const bump = bumpLevelFromMessage(commit.message);

              if (bump > maxBump) maxBump = bump;
              if (maxBump === MAJOR) break;
            }

            const currentTitle = context.payload.pull_request.title;
            const titleMatch = currentTitle.match(/^([a-z]+)(\([^)]+\))?(!)?: (.+)$/i);

            if (!titleMatch) {
              core.warning(`PR title "${currentTitle}" does not follow Conventional Commits format — skipping sync`);
              return;
            }

            const [, type, scope, bang, subject] = titleMatch;
            const scopePart = scope || '';
            const currentBump = bang ? MAJOR : (MINOR_TYPES.has(type.toLowerCase()) ? MINOR : PATCH);

            if (maxBump <= currentBump) {
              core.info(`No title update needed (title bump: ${currentBump}, max commit bump: ${maxBump})`);
              return;
            }

            const newType = maxBump === MINOR ? 'feat' : type;
            const newBang = maxBump >= MAJOR ? '!' : '';

            const newTitle = `${newType}${scopePart}${newBang}: ${subject}`;

            core.notice(`Updating PR title from "${currentTitle}" to "${newTitle}"`);

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: PR_NUMBER,
              title: newTitle,
            });

  lint-pr-title:
    runs-on: ubuntu-latest
    needs: sync-pr-title-with-commits
    if: always()
    permissions:
      pull-requests: read
    name: Validate PR title follows Conventional Commits
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ inputs.types }}
          requireScope: ${{ inputs.require-scope }}
